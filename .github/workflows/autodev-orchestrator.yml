name: AutoDev Orchestrator

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to initialize or reconcile
        required: true
        type: number

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: autodev-issue-${{ github.event.issue.number || inputs.issue_number }}
  queue: max

jobs:
  orchestrate:
    if: >-
      (github.event_name != 'issues' || github.event.label.name == 'autodev') &&
      (github.event_name != 'issue_comment' || (
        !github.event.issue.pull_request &&
        contains(github.event.comment.body, '```autodev-result:v1')
      ))
    runs-on: ubuntu-latest
    steps:
      - name: Check actor permission
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          if ! permission="$(gh api \
            "repos/$GH_REPO/collaborators/$ACTOR/permission" \
            --jq '.permission')"; then
            echo "::warning::Unable to verify repository permission for $ACTOR."
            permission="none"
          fi

          case "$permission" in
            admin|maintain|write)
              echo "allowed=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Checkout repository
        if: ${{ steps.authorize.outputs.allowed == 'true' }}
        uses: actions/checkout@v6

      - name: Set up Node.js
        if: ${{ steps.authorize.outputs.allowed == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run AutoDev orchestrator
        if: ${{ steps.authorize.outputs.allowed == 'true' }}
        env:
          AUTODEV_AGENT_TASKS_TOKEN: ${{ secrets.AUTODEV_AGENT_TASKS_TOKEN }}
          AUTODEV_CALLBACK_TOKEN: ${{ secrets.AUTODEV_CALLBACK_TOKEN }}
          AUTODEV_GITHUB_TOKEN: ${{ github.token }}
          AUTODEV_ORCHESTRATOR_LOGIN: github-actions[bot]
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number || '' }}
        run: node .github/scripts/autodev/main.mjs
